[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

# Expiry windows (>= MIN_EXPIRY, default 60 s) are timestamp-based by design; validator skew of a few
# seconds is irrelevant to them, so this lint is noise here.
[lint]
exclude_lints = ["block-timestamp"]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 128
fail_on_revert = false

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
